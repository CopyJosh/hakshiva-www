<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFAF15" />
    </linearGradient>
    <linearGradient id="supportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>

  <!-- Graphic Icon: Nurturing Support Figures -->
  <g transform="translate(10, 5)">
    <!-- Main outer ring / protective shield -->
    <circle cx="30" cy="30" r="28" fill="none" stroke="url(#supportGrad)" stroke-width="2.5" opacity="0.15" />
    
    <!-- Large support figure -->
    <path d="M22,35 C22,25 38,25 38,35 C38,45 22,45 22,35 Z" fill="url(#supportGrad)" opacity="0.8" />
    <circle cx="30" cy="22" r="6" fill="url(#supportGrad)" />
    
    <!-- Smaller child figure being nurtured -->
    <path d="M28,40 C28,32 42,32 42,40 C42,48 28,48 28,40 Z" fill="url(#logoGrad)" />
    <circle cx="35" cy="29" r="4.5" fill="url(#logoGrad)" />
    
    <!-- Decorative organic leaf representing growth -->
    <path d="M12,18 C16,14 20,18 20,24 C14,24 12,20 12,18 Z" fill="#14B8A6" opacity="0.9" />
  </g>

  <!-- Typography Text -->
  <g transform="translate(85, 41)">
    <!-- English Name -->
    <text font-family="'Outfit', 'Inter', sans-serif" font-size="28" font-weight="800" fill="#071B2F" letter-spacing="-0.5">Hakshiva</text>
    <!-- Tagline beneath -->
    <text font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1.5" y="16">SUPPORTING OUR YOUTH</text>
  </g>
</svg>
